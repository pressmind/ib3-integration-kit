<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Pressmind IB3 - Example Layout</title>

    <!--
        Viewport Meta Tag (optional):
        If you include your own viewport meta tag here, the IBE will use it.
        If you omit it, the IBE automatically injects a default:
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

        The default disables pinch-to-zoom on mobile devices to prevent
        layout issues during the booking process.
        If you want to allow zooming (recommended for WCAG AA compliance),
        include your own tag:
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    -->

    <!--
        REQUIRED PLACEHOLDERS - Header Assets:
        The IBE injects its CSS and JavaScript dependencies here.
        Use HTML comment syntax so the placeholders don't render
        as visible text when opening this file directly in a browser.
    -->
    <!--###PRESSMIND_IBE_HEADER_CSS###-->
    <!--###PRESSMIND_IBE_HEADER_SCRIPTS###-->

    <!-- Reset IBE-injected margin-top on #pressmind_ib3 (cannot be set inline; target is injected by IBE). -->
    <style>.ibe-content-wrapper #pressmind_ib3 { margin-top: 0 !important; }</style>
</head>
<body>

    <!--
        WCAG AA: All visible page content should be contained within landmark elements.
        Use <header> and <footer>. Do NOT use <main>: the IBE sets role="main" on
        #pressmind_ib3. A template <main> would create a duplicate main landmark.
        Use a <div> to wrap the IBE content placeholder.
    -->

    <!-- LANDMARK: <header> - Your site header (logo, navigation). Sticky so StepBar sticks below it. -->
    <header style="position: sticky; top: 0; z-index: 1000; background-color: inherit;">
        <!-- Example: company logo, main navigation, service hotline -->
    </header>

    <!-- Content wrapper (no <main> - IBE provides the main landmark). -->
    <div class="ibe-content-wrapper">
        <!-- REQUIRED: IBE booking engine is injected here. -->
        <!--###PRESSMIND_IBE_CONTENT###-->
    </div>

    <!-- LANDMARK: <footer> - Your site footer (legal links, contact). -->
    <footer>
        <!-- Example: company info, legal links (privacy policy, imprint) -->
    </footer>

    <!--
        REQUIRED PLACEHOLDER - Footer Scripts:
        The IBE injects its JavaScript libraries here (jQuery, Bootstrap, Vue.js, etc.).
        Must be placed before </body>. Do NOT include your own copies of
        jQuery, Bootstrap, or Vue.js - they are already provided by the IBE.
    -->
    <!--###PRESSMIND_IBE_FOOTER_SCRIPTS###-->

</body>
</html>
